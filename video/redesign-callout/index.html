<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-accent","type":"color","label":"Accent (yellow)","default":"#FFD23F"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#111111"},
    {"id":"color-paper","type":"color","label":"Paper","default":"#FFFFFF"},
    {"id":"color-alert","type":"color","label":"Alert (red)","default":"#E5322D"},
    {"id":"color-go","type":"color","label":"Go (green)","default":"#21B36B"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Redesign Callout</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-accent: #ffd23f;
        --color-ink: #111111;
        --color-paper: #ffffff;
        --color-alert: #e5322d;
        --color-go: #21b36b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ink);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* ---- Shared by every scene ---- */
      .layer {
        position: absolute;
        inset: 0;
      }
      /* Big centred type: the message itself. */
      .big {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Archivo Black", sans-serif;
        text-transform: uppercase;
        line-height: 0.98;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .big .w {
        display: inline-block;
      }
      .big .hl {
        display: inline-block;
        background: var(--color-accent);
        color: var(--color-ink);
        padding: 0.04em 0.14em 0;
      }
      .big .hl-ink {
        display: inline-block;
        background: var(--color-ink);
        color: var(--color-accent);
        padding: 0.04em 0.14em 0;
      }
      .kicker {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 52px;
        letter-spacing: 0.01em;
      }
      /* Illustrations: thick ink outlines, flat fills, hard offset shadow. */
      .ico {
        position: absolute;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38" data-width="1920" data-height="1080">
      <!-- Scenes overlap by 0.4 s: each new scene floods its ground over the last one. -->
      <div id="s1-hey" data-composition-id="s1-hey" data-composition-src="compositions/s1-hey.html"
        data-start="0" data-duration="3.8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s2-upgrade" data-composition-id="s2-upgrade" data-composition-src="compositions/s2-upgrade.html"
        data-start="3.4" data-duration="3.6" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s3-problems" data-composition-id="s3-problems" data-composition-src="compositions/s3-problems.html"
        data-start="6.6" data-duration="5.8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s4-losing" data-composition-id="s4-losing" data-composition-src="compositions/s4-losing.html"
        data-start="12" data-duration="4" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="s5-offer" data-composition-id="s5-offer" data-composition-src="compositions/s5-offer.html"
        data-start="15.6" data-duration="5.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="s6-real" data-composition-id="s6-real" data-composition-src="compositions/s6-real.html"
        data-start="20.6" data-duration="7.1" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 6"></div>
      <div id="s7-benefits" data-composition-id="s7-benefits" data-composition-src="compositions/s7-benefits.html"
        data-start="27.3" data-duration="4.1" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 7"></div>
      <div id="s8-cta" data-composition-id="s8-cta" data-composition-src="compositions/s8-cta.html"
        data-start="31" data-duration="7" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 8"></div>

      <!-- Brand mark: small DW logo, top-right corner, whole video -->
      <img id="brand-logo" class="clip" src="assets/brand/dw-logo-style.png" alt="DW logo"
        data-start="0" data-duration="38" data-track-index="9"
        style="position: absolute; left: 1704px; top: 60px; width: 120px; height: auto; z-index: 30" />

      <!-- Music bed: original track generated locally with MusicGen, looped; sits ~10 dB under the voice -->
      <audio id="bgm" class="clip" src="assets/bgm/bed.mp3" data-start="0" data-duration="38" data-track-index="30" data-volume="0.32" data-fade-in="0.4" data-fade-out="2"></audio>

      <!-- Voiceover: American male (Kokoro am_michael), one clip per line -->
      <audio id="vo-01" class="clip" src="assets/vo/l01.wav" data-start="0.4" data-duration="1.140" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-02" class="clip" src="assets/vo/l02.wav" data-start="2.05" data-duration="0.778" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-03" class="clip" src="assets/vo/l03.wav" data-start="3.6" data-duration="2.045" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-04" class="clip" src="assets/vo/l04.wav" data-start="6.8" data-duration="1.011" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-05" class="clip" src="assets/vo/l05.wav" data-start="8.35" data-duration="1.472" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-06" class="clip" src="assets/vo/l06.wav" data-start="10.35" data-duration="1.347" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-07" class="clip" src="assets/vo/l07.wav" data-start="12.2" data-duration="2.938" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-08" class="clip" src="assets/vo/l08.wav" data-start="15.8" data-duration="1.151" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-09" class="clip" src="assets/vo/l09.wav" data-start="17.35" data-duration="1.359" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-10" class="clip" src="assets/vo/l10.wav" data-start="18.85" data-duration="0.727" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-11" class="clip" src="assets/vo/l11.wav" data-start="20.85" data-duration="1.480" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-12" class="clip" src="assets/vo/l12.wav" data-start="22.75" data-duration="3.966" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-13" class="clip" src="assets/vo/l13.wav" data-start="27.45" data-duration="0.595" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-14" class="clip" src="assets/vo/l14.wav" data-start="28.35" data-duration="0.829" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-15" class="clip" src="assets/vo/l15.wav" data-start="29.45" data-duration="0.962" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-16" class="clip" src="assets/vo/l16.wav" data-start="31.2" data-duration="2.486" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-17" class="clip" src="assets/vo/l17.wav" data-start="34.0" data-duration="1.500" data-track-index="20" data-volume="1"></audio>

      <!-- Sound effects (each placed so its peak lands on its picture) -->
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="1.79" data-duration="0.575" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="3.28" data-media-start="2.2" data-duration="1.3" data-track-index="11" data-volume="0.3" data-fade-out="0.4"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="16.39" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="17.58" data-media-start="1.8" data-duration="1.7" data-track-index="13" data-volume="0.18" data-fade-in="0.3"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="19.21" data-duration="2.1" data-track-index="14" data-volume="0.3" data-fade-out="0.8"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="20.5" data-duration="0.575" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="23.26" data-duration="0.72" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="30.45" data-media-start="2.2" data-duration="1.3" data-track-index="11" data-volume="0.45" data-fade-out="0.4"></audio>
      <audio id="sfx-click" class="clip" src="assets/sfx/click.mp3" data-start="34.57" data-duration="0.366" data-track-index="15" data-volume="1.2"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="34.81" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
