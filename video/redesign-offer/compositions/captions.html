  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      document.querySelectorAll('[data-composition-id="captions"] .cap').forEach((cap) => {
        const start = parseFloat(cap.dataset.start);
        const end = start + parseFloat(cap.dataset.duration);
        const box = cap.querySelector(".cap-box");
        const words = cap.querySelectorAll(".w");
        // Box wipes open from the left at the pace of the words, which blur in one after another.
        tl.fromTo(box, { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% -4% -12% 0%)", duration: 0.1 + 0.067 * words.length, ease: "power1.out" }, start);
        tl.fromTo(words, { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, start);
        // Clean exit, then a hard kill so a stale group can never linger.
        tl.to(box, { opacity: 0, y: 12, filter: "blur(4px)", duration: 0.14, ease: "power3.in" }, end - 0.16);
        tl.set(box, { opacity: 0 }, end - 0.02);
      });
      window.__timelines["captions"] = tl;
    })();
