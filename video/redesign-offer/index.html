<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-accent","type":"color","label":"Accent (yellow)","default":"#FFD23F"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#111111"},
    {"id":"color-paper","type":"color","label":"Paper","default":"#FFFFFF"},
    {"id":"color-alert","type":"color","label":"Alert (problem stamps)","default":"#E5322D"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Redesign Offer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-accent: #ffd23f;
        --color-ink: #111111;
        --color-paper: #ffffff;
        --color-alert: #e5322d;
        --font-display: "Archivo Black", sans-serif;
        --font-body: "Outfit", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ink);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scenes -->
      <div id="s1-hook" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html"
        data-start="0" data-duration="5.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s2-problem" data-composition-id="s2-problem" data-composition-src="compositions/s2-problem.html"
        data-start="5.2" data-duration="6.4" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s3-seconds" data-composition-id="s3-seconds" data-composition-src="compositions/s3-seconds.html"
        data-start="11.6" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s4-reveal" data-composition-id="s4-reveal" data-composition-src="compositions/s4-reveal.html"
        data-start="15.6" data-duration="5.2" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="s5-real" data-composition-id="s5-real" data-composition-src="compositions/s5-real.html"
        data-start="20.8" data-duration="10.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="s6-proof" data-composition-id="s6-proof" data-composition-src="compositions/s6-proof.html"
        data-start="31" data-duration="5.6" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 6"></div>
      <div id="s7-cta" data-composition-id="s7-cta" data-composition-src="compositions/s7-cta.html"
        data-start="36.6" data-duration="8.9" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 7"></div>

      <!-- Captions: every caption group lives in this one host -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="38.9" data-track-index="3" data-track-kind="captions"
        data-width="1920" data-height="1080" style="z-index: 20"></div>

      <!-- Music bed: original track generated locally with MusicGen, looped; sits ~10 dB under the voice -->
      <audio id="bgm" class="clip" src="assets/bgm/bed.mp3" data-start="0" data-duration="45.5" data-track-index="30" data-volume="0.32" data-fade-in="0.4" data-fade-out="2"></audio>

      <!-- Voiceover: American male (Kokoro am_michael), one clip per line, each placed on its picture -->
      <audio id="vo-01" class="clip" src="assets/vo/v01.wav" data-start="0.35" data-duration="1.668" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-02" class="clip" src="assets/vo/v02.wav" data-start="5.5" data-duration="1.625" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-03" class="clip" src="assets/vo/v03.wav" data-start="7.55" data-duration="0.756" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-04" class="clip" src="assets/vo/v04.wav" data-start="8.5" data-duration="0.603" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-05" class="clip" src="assets/vo/v05.wav" data-start="9.25" data-duration="1.257" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-06" class="clip" src="assets/vo/v06.wav" data-start="11.85" data-duration="1.715" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-07" class="clip" src="assets/vo/v07.wav" data-start="13.75" data-duration="0.997" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-08" class="clip" src="assets/vo/v08.wav" data-start="15.75" data-duration="1.087" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-09" class="clip" src="assets/vo/v09.wav" data-start="16.9" data-duration="1.911" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-10" class="clip" src="assets/vo/v10.wav" data-start="18.85" data-duration="0.724" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-11" class="clip" src="assets/vo/v11.wav" data-start="21.0" data-duration="2.250" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-12" class="clip" src="assets/vo/v12.wav" data-start="23.55" data-duration="1.648" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-13" class="clip" src="assets/vo/v13.wav" data-start="25.45" data-duration="1.959" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-14" class="clip" src="assets/vo/v14.wav" data-start="28.0" data-duration="1.474" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-15" class="clip" src="assets/vo/v15.wav" data-start="31.3" data-duration="1.047" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-16" class="clip" src="assets/vo/v16.wav" data-start="33.1" data-duration="0.829" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-17" class="clip" src="assets/vo/v17.wav" data-start="34.9" data-duration="1.015" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-18" class="clip" src="assets/vo/v18.wav" data-start="36.85" data-duration="1.475" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-19" class="clip" src="assets/vo/v19.wav" data-start="39.25" data-duration="2.435" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-20" class="clip" src="assets/vo/v20.wav" data-start="41.9" data-duration="2.353" data-track-index="20" data-volume="1"></audio>

      <!-- Sound effects (each placed so its peak lands one frame after its picture) -->
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.07" data-duration="0.575" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="7.46" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="8.41" data-duration="0.72" data-track-index="15" data-volume="0.55"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="9.16" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="11.33" data-media-start="2.2" data-duration="1.4" data-track-index="10" data-volume="0.35" data-fade-out="0.4"></audio>
      <audio id="sfx-click-1" class="clip" src="assets/sfx/click.mp3" data-start="14.31" data-duration="0.366" data-track-index="12" data-volume="1.2"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="17.43" data-media-start="1.8" data-duration="1.7" data-track-index="13" data-volume="0.2" data-fade-in="0.3"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="19.06" data-duration="2.1" data-track-index="14" data-volume="0.25" data-fade-out="0.8"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="20.67" data-duration="0.575" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-pop-4" class="clip" src="assets/sfx/pop.mp3" data-start="26.86" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-click-2" class="clip" src="assets/sfx/click.mp3" data-start="28.06" data-duration="0.366" data-track-index="12" data-volume="1.2"></audio>
      <audio id="sfx-click-3" class="clip" src="assets/sfx/click-soft.mp3" data-start="29.26" data-duration="0.366" data-track-index="12" data-volume="1.2"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="30.73" data-media-start="2.2" data-duration="1.4" data-track-index="10" data-volume="0.3" data-fade-out="0.4"></audio>
      <audio id="sfx-pop-5" class="clip" src="assets/sfx/pop.mp3" data-start="34.81" data-duration="0.72" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-5" class="clip" src="assets/sfx/whoosh.mp3" data-start="38.77" data-duration="0.575" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-click-4" class="clip" src="assets/sfx/click.mp3" data-start="42.36" data-duration="0.366" data-track-index="12" data-volume="1.2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
